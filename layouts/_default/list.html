{{ define "main" }}
<article class="prose">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    
    <div class="section-list">
        {{ range .Pages }}
        <a href="{{ .RelPermalink }}" class="section-card">
            <h3>{{ .Title }}</h3>
            {{ if .Description }}
            <p>{{ .Description }}</p>
            {{ end }}
        </a>
        {{ end }}
    </div>
</article>
{{ end }}
